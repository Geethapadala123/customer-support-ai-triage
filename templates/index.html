<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI-powered customer support chatbot — get instant answers to your questions." />
  <title>Customer Support AI</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-pattern"></div>

  <div class="app-container">
    <div class="chat-window">

      <!-- Header -->
      <div class="chat-header">
        <div class="bot-avatar">
          🤖
          <span class="status-dot"></span>
        </div>
        <div class="header-info">
          <h1>Support Assistant</h1>
          <span class="status-text">● Online — Ready to help</span>
        </div>
        <div class="header-actions">
          <button class="header-btn" id="clear-btn" title="Clear chat">🗑️</button>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages-container" id="messages">
        <!-- Welcome -->
        <div class="welcome-section">
          <div class="welcome-icon">👋</div>
          <h2>Welcome!</h2>
          <p>I'm your AI support assistant. Ask me anything about orders, billing, accounts, or shipping — I'm here to help.</p>
        </div>

        <!-- Date Divider -->
        <div class="date-divider">
          <span>Today</span>
        </div>

        <!-- Typing Indicator (hidden by default) -->
        <div class="typing-indicator" id="typing-indicator">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <!-- Quick Replies -->
      <div class="quick-replies" id="quick-replies">
        <!-- Populated by JS -->
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="message-input"
            placeholder="Type your message..."
            rows="1"
            autocomplete="off"
          ></textarea>
        </div>
        <button id="send-btn" title="Send message">
          ➤
        </button>
      </div>

    </div>
  </div>

  <script src="/static/js/chat.js"></script>
</body>
</html>
